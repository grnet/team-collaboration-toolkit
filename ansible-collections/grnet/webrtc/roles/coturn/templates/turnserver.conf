proc-user=turnserver
listening-ip=0.0.0.0
listening-ip=::
listening-port=3478
tls-listening-port=5349
min-port={{ coturn_min_port }}
max-port={{ coturn_max_port }}
{% if coturn_use_http_ports %}
aux-server=0.0.0.0:80
aux-server=[::]:80
aux-server=0.0.0.0:443
aux-server=[::]:443
{% endif %}
syslog

cert=/etc/letsencrypt/live/{{ coturn_fqdn }}/fullchain.pem
pkey=/etc/letsencrypt/live/{{ coturn_fqdn }}/privkey.pem

use-auth-secret
static-auth-secret={{ coturn_static_auth_secret }}
realm={{ coturn_realm }}
